name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-backend:
    name: Build Java backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: histr-api

    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn clean package -DskipTests

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-backend
    env:
      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat > ~/.ssh/config <<EOF
          Host home-server
              HostName ssh.winnerx0.dev
              User winner
              IdentityFile ~/.ssh/deploy_key
              ProxyCommand cloudflared access ssh --hostname %h
              StrictHostKeyChecking no
          EOF

          chmod 600 ~/.ssh/config

      - name: Ensure app directory exists
        run: |
          ssh home-server "
          mkdir -p ${{ secrets.VPS_APP_DIR || '/opt/histr' }}
          "

      - name: Deploy via SSH
        run: |
          ssh home-server bash <<'EOF'
          set -euo pipefail
          REPO="git@github.com:winnerx0/histr.git"
          BRANCH="main"
          DEPLOY_DIR="${{ secrets.VPS_APP_DIR || '/opt/histr' }}"
          COMPOSE_FILE="docker-compose-prod.yml"

          if [ -d "$DEPLOY_DIR/.git" ]; then
            git -C "$DEPLOY_DIR" fetch origin
            git -C "$DEPLOY_DIR" reset --hard origin/$BRANCH
          else
            git -C "$DEPLOY_DIR" init
            git -C "$DEPLOY_DIR" remote add origin "$REPO"
            git -C "$DEPLOY_DIR" fetch origin "$BRANCH"
            git -C "$DEPLOY_DIR" checkout -B "$BRANCH" "origin/$BRANCH"
          fi

          cd "$DEPLOY_DIR"
          docker volume create certbot_certs >/dev/null
          docker compose -f "$COMPOSE_FILE" down --remove-orphans
          docker compose -f "$COMPOSE_FILE" build --no-cache
          docker compose -f "$COMPOSE_FILE" up -d
          sleep 5
          docker compose -f "$COMPOSE_FILE" ps
          docker compose -f "$COMPOSE_FILE" logs --tail=20
          EOF
